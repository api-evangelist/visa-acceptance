naftiko: 1.0.0-alpha2
info:
  label: Visa Acceptance Payments API — Captures
  description: 'Visa Acceptance Payments API — Captures. 1 operations. Lead operation: Capture Payment. Self-contained Naftiko
    capability covering one Visa Acceptance business surface.'
  tags:
  - Visa Acceptance
  - Captures
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    VISA_ACCEPTANCE_API_KEY: VISA_ACCEPTANCE_API_KEY
capability:
  consumes:
  - type: http
    namespace: payments-captures
    baseUri: https://api.visaacceptance.com
    description: Visa Acceptance Payments API — Captures business capability. Self-contained, no shared references.
    resources:
    - name: pts-v2-payments-paymentId-captures
      path: /pts/v2/payments/{paymentId}/captures
      operations:
      - name: capturepayment
        method: POST
        description: Capture Payment
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: paymentId
          in: path
          type: string
          description: The payment ID returned from the authorization request
          required: true
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    authentication:
      type: bearer
      token: '{{env.VISA_ACCEPTANCE_API_KEY}}'
  exposes:
  - type: rest
    namespace: payments-captures-rest
    port: 8080
    description: REST adapter for Visa Acceptance Payments API — Captures. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/pts/v2/payments/{paymentid}/captures
      name: pts-v2-payments-paymentid-captures
      description: REST surface for pts-v2-payments-paymentId-captures.
      operations:
      - method: POST
        name: capturepayment
        description: Capture Payment
        call: payments-captures.capturepayment
        with:
          paymentId: rest.paymentId
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: payments-captures-mcp
    port: 9090
    transport: http
    description: MCP adapter for Visa Acceptance Payments API — Captures. One tool per consumed operation, routed inline through
      this capability's consumes block.
    tools:
    - name: capture-payment
      description: Capture Payment
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: payments-captures.capturepayment
      with:
        paymentId: tools.paymentId
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
