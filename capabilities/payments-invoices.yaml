naftiko: 1.0.0-alpha2
info:
  label: Visa Acceptance Payments API — Invoices
  description: 'Visa Acceptance Payments API — Invoices. 4 operations. Lead operation: Create Invoice. Self-contained Naftiko
    capability covering one Visa Acceptance business surface.'
  tags:
  - Visa Acceptance
  - Invoices
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    VISA_ACCEPTANCE_API_KEY: VISA_ACCEPTANCE_API_KEY
capability:
  consumes:
  - type: http
    namespace: payments-invoices
    baseUri: https://api.visaacceptance.com
    description: Visa Acceptance Payments API — Invoices business capability. Self-contained, no shared references.
    resources:
    - name: pts-v2-invoices
      path: /pts/v2/invoices
      operations:
      - name: createinvoice
        method: POST
        description: Create Invoice
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
      - name: listinvoices
        method: GET
        description: List Invoices
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: status
          in: query
          type: string
          description: Filter by invoice status
        - name: limit
          in: query
          type: integer
          description: Maximum number of invoices to return
    - name: pts-v2-invoices-invoiceId
      path: /pts/v2/invoices/{invoiceId}
      operations:
      - name: getinvoice
        method: GET
        description: Get Invoice
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: invoiceId
          in: path
          type: string
          required: true
      - name: updateinvoice
        method: PATCH
        description: Update Invoice
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: invoiceId
          in: path
          type: string
          required: true
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    authentication:
      type: bearer
      token: '{{env.VISA_ACCEPTANCE_API_KEY}}'
  exposes:
  - type: rest
    namespace: payments-invoices-rest
    port: 8080
    description: REST adapter for Visa Acceptance Payments API — Invoices. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/pts/v2/invoices
      name: pts-v2-invoices
      description: REST surface for pts-v2-invoices.
      operations:
      - method: POST
        name: createinvoice
        description: Create Invoice
        call: payments-invoices.createinvoice
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
      - method: GET
        name: listinvoices
        description: List Invoices
        call: payments-invoices.listinvoices
        with:
          status: rest.status
          limit: rest.limit
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/pts/v2/invoices/{invoiceid}
      name: pts-v2-invoices-invoiceid
      description: REST surface for pts-v2-invoices-invoiceId.
      operations:
      - method: GET
        name: getinvoice
        description: Get Invoice
        call: payments-invoices.getinvoice
        with:
          invoiceId: rest.invoiceId
        outputParameters:
        - type: object
          mapping: $.
      - method: PATCH
        name: updateinvoice
        description: Update Invoice
        call: payments-invoices.updateinvoice
        with:
          invoiceId: rest.invoiceId
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: payments-invoices-mcp
    port: 9090
    transport: http
    description: MCP adapter for Visa Acceptance Payments API — Invoices. One tool per consumed operation, routed inline through
      this capability's consumes block.
    tools:
    - name: create-invoice
      description: Create Invoice
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: payments-invoices.createinvoice
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: list-invoices
      description: List Invoices
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: payments-invoices.listinvoices
      with:
        status: tools.status
        limit: tools.limit
      outputParameters:
      - type: object
        mapping: $.
    - name: get-invoice
      description: Get Invoice
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: payments-invoices.getinvoice
      with:
        invoiceId: tools.invoiceId
      outputParameters:
      - type: object
        mapping: $.
    - name: update-invoice
      description: Update Invoice
      hints:
        readOnly: false
        destructive: false
        idempotent: true
      call: payments-invoices.updateinvoice
      with:
        invoiceId: tools.invoiceId
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
